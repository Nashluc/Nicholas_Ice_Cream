<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Nicholas Ice Cream</title>

    <!-- Conexión con la hoja de estilos -->
    <link rel="stylesheet" href="../Style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>

<body>

    <!-- Encabezado principal -->
    <header>
        <div class="logo">
            <img src="../Imagen/Nicholas_Logo.png" alt="Nicholas Ice Cream">
        </div>

        <!-- Menú de navegación -->
        <nav>
            <a href="../Index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="sabores.html">Sabores</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>

        <!-- Presentación -->
        <section class="presentacion">
            <div class="presentacion-contenido">

                <h1>Contáctanos </h1>

                <p>
                    ¿Tienes alguna pregunta o quieres conocer
                    más sobre Nicholas Ice Cream?
                    ¡Escríbenos!
                </p>

            </div>
        </section>

        <!-- Formulario de contacto -->
        <section class="productos-destacados">
            <h2>Envíanos un mensaje </h2>

            <p class="intro-productos">
                Completa el formulario y nos pondremos en contacto contigo.
            </p>

            <form id="formularioContacto">

                <!-- Nombre -->
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre"
                        placeholder="Escribe tu nombre">

                    <small id="errorNombre"></small>
                </div>

                <br>

                <!-- Correo -->
                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo"
                        placeholder="ejemplo@correo.com">

                    <small id="errorCorreo"></small>
                </div>

                <br>

                <!-- Mensaje -->
                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje"
                        placeholder="Escribe tu mensaje"></textarea>

                    <small id="errorMensaje"></small>
                </div>

                <br>

                <!-- Botón -->
                <button type="submit" class="sabores-button">
                    Enviar mensaje
                </button>

                <!-- Mensaje de confirmación -->
                <p id="mensajeExito"></p>

            </form>

        </section>

    </main>

    <!-- Conexión con JavaScript -->
    <script src="../script.js"></script>

</body>
</html>
