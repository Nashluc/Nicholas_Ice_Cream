<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservaciones | Nicholas Ice Cream</title>

    <!-- Conexión con CSS -->
    <link rel="stylesheet" href="../Style.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Encabezado -->
    <header>
        <div class="logo">
            <img src="../Imagen/Nicholas_Logo.png" alt="Nicholas Ice Cream">
        </div>

        <!-- Menú de navegación -->
        <nav>
            <a href="../Index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="sabores.html">Sabores</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>

        <!-- Presentación -->
        <section class="presentacion">
            <div class="presentacion-contenido">

                <h1>Reserva tu momento dulce </h1>

                <p>
                    ¿Quieres celebrar un cumpleaños, compartir con tu familia
                    o simplemente disfrutar de un buen helado?
                </p>

                <p>
                    Completa nuestro formulario de reservación.
                </p>

            </div>
        </section>

        <!-- Formulario -->
        <section class="productos-destacados">

            <h2>Haz tu reservación </h2>

            <p class="intro-productos">
                Déjanos tus datos y cuéntanos qué estás planificando.
            </p>

            <form id="formularioReserva">

                <div class="mb-3">
                    <label for="nombreReserva" class="form-label">
                        Nombre
                    </label>

                    <input type="text"
                           class="form-control"
                           id="nombreReserva"
                           placeholder="Escribe tu nombre">
                </div>

                <div class="mb-3">
                    <label for="correoReserva" class="form-label">
                        Correo electrónico
                    </label>

                    <input type="email"
                           class="form-control"
                           id="correoReserva"
                           placeholder="ejemplo@correo.com">
                </div>

                <div class="mb-3">
                    <label for="fechaReserva" class="form-label">
                        Fecha de la reservación
                    </label>

                    <input type="date"
                           class="form-control"
                           id="fechaReserva">
                </div>

                <div class="mb-3">
                    <label for="personasReserva" class="form-label">
                        Cantidad de personas
                    </label>

                    <input type="number"
                           class="form-control"
                           id="personasReserva"
                           min="1"
                           placeholder="Cantidad de personas">
                </div>

                <div class="mb-3">
                    <label for="tipoReserva" class="form-label">
                        Tipo de reservación
                    </label>

                    <select class="form-select" id="tipoReserva">

    <option selected disabled>
        Selecciona una opción
    </option>

    <option>Cumpleaños</option>
    <option>Reunión familiar</option>
    <option>Evento especial</option>
    <option>Otra ocasión</option>

    </select>

                        
                </div>

                <div class="mb-3">
                    <label for="mensajeReserva" class="form-label">
                        Detalles adicionales
                    </label>

                    <textarea class="form-control"
                              id="mensajeReserva"
                              rows="4"
                              placeholder="Cuéntanos qué necesitas..."></textarea>
                </div>

                <button type="submit" class="sabores-button">
                    Solicitar reservación 
                </button>

            </form>

        </section>

       </main>

    <script src="../script.js"></script>

</body>
</html>
